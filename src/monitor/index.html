<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloudflare · 負載監看 / Load monitor</title><link rel="stylesheet" href="./monitor.css"><script defer src="./monitor.js"></script></head><body>
<header class="site-header"><div class="header-inner"><a class="brand" href="/" aria-label="BC Relay home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>BC <b>Relay</b></span><span class="brand-tag">MONITOR</span></a><nav class="main-nav"><a id="home-link" href="/">遊戲入口</a><a id="monitor-link" href="./" aria-current="page">負載監看</a></nav><button id="language" class="button button-secondary" type="button">English</button></div></header><main class="monitor-shell">

<p class="eyebrow">CLOUDFLARE · OPERATOR METRICS</p><h1 id="title">負載監看</h1><p id="intro">供維護者查看用量與負載，也開放其他人參考。</p>
<div class="toolbar"><strong id="project">—</strong><button id="refresh" type="button">重新整理</button></div><p id="status" role="status">讀取中…</p>
<div class="monitor-meta"><p id="updated">—</p><p id="freshness"></p></div><div id="view-tabs" role="tablist" aria-label="Analytics views">
<button type="button" id="tab-overview" role="tab" aria-controls="view-panel" aria-selected="true" data-view="overview">總覽</button>
<button type="button" id="tab-history" role="tab" aria-controls="view-panel" aria-selected="false" tabindex="-1" data-view="history">週月統計</button>
<button type="button" id="tab-errors" role="tab" aria-controls="view-panel" aria-selected="false" tabindex="-1" data-view="errors">錯誤</button>
<button type="button" id="tab-performance" role="tab" aria-controls="view-panel" aria-selected="false" tabindex="-1" data-view="performance">效能</button>
</div><div id="view-panel" role="tabpanel" aria-labelledby="tab-overview"><section id="cards" aria-label="Metrics"></section>
<section class="panel" id="chart-panel"><div class="section-number">01 / ACTIVITY</div><h2 id="activity-title">每小時執行狀態</h2><p id="activity-help" class="muted"></p><div id="activity-grid" role="group"></div><p id="activity-legend" class="muted"></p><h2 id="chartTitle">最近 24 小時請求量</h2><p id="chart-help" class="muted"></p><div id="chart" role="group"></div>
<section id="hour-detail" aria-live="polite" aria-atomic="true"></section>
<details><summary id="tableTitle">每小時數據（UTC，最新優先）</summary><div class="table-wrap"><table><thead><tr><th id="hourLabel" scope="col">UTC</th><th id="requestsLabel" scope="col">請求</th><th id="errorsLabel" scope="col">錯誤</th><th id="rateLabel" scope="col">錯誤率</th></tr></thead><tbody id="rows"></tbody></table></div></details>
</section><section class="panel"><h2 id="insight-title"></h2><div id="insights"></div></section></div><details class="notes"><summary id="notes-label">統計說明與限制</summary><p id="limits" class="muted"></p></details>
<footer><a href="./monitor.md">設定文件 / Setup (MD)</a><a id="dashboard" href="https://dash.cloudflare.com/" target="_blank" rel="noopener noreferrer">Cloudflare 管理台 ↗</a><a id="integration" href="./guide.html">接入／移植說明</a><a href="https://bondageclub-lite.pages.dev/monitor/">Lite</a><a href="https://bondageclub-relay.pages.dev/monitor/">Relay</a><a href="https://developers.cloudflare.com/workers/observability/metrics-and-analytics/">Cloudflare docs</a></footer>
</main></body></html>
