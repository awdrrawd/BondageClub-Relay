version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '08:11'
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '08:11'
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
